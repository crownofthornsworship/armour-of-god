<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07162a">
  <title>The Armour of God</title>
  <meta name="description" content="A mobile-friendly Christian action game about standing firm in God's truth.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f6c453' d='M32 4 54 12v17c0 14-9 25-22 31C19 54 10 43 10 29V12z'/%3E%3Cpath fill='%2307162a' d='M29 15h6v12h10v6H35v16h-6V33H19v-6h10z'/%3E%3C/svg%3E">
  <style>
    :root{--night:#07162a;--blue:#0c2d52;--sky:#67d4ff;--gold:#f6c453;--cream:#fff4d2;--red:#f66b6b;--green:#72e6a2;--ink:#06101e}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--night);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:white;touch-action:none}button{font:inherit}
    #app{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#174d79 0,#07162a 58%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #game{position:relative;width:min(100vw,760px);height:min(100dvh,920px);overflow:hidden;background:#0b2848;box-shadow:0 0 60px #0008}
    canvas{width:100%;height:100%;display:block}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(#07162acd,#07162af5);z-index:20}
    .hidden{display:none!important}.crest{width:118px;height:135px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe88f,#d59421);clip-path:polygon(50% 0,95% 18%,87% 70%,50% 100%,13% 70%,5% 18%);font-size:64px;filter:drop-shadow(0 10px 10px #0007)}
    h1{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(2.2rem,9vw,4.2rem);line-height:.88;margin:18px 0 8px;color:var(--cream);text-shadow:0 4px 0 #8b5315}h1 span{color:var(--gold)}
    .lead{max-width:520px;font-size:1.08rem;line-height:1.45;margin:4px auto 18px;color:#d9edff}.verse{font-family:Georgia,serif;color:var(--gold);font-size:1.04rem;margin-bottom:20px}
    .primary,.secondary{border:0;border-radius:999px;padding:14px 25px;font-weight:900;letter-spacing:.04em;min-width:210px;cursor:pointer}.primary{background:var(--gold);color:#14213a;box-shadow:0 6px 0 #9e6617}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #9e6617}.secondary{background:#ffffff18;color:white;border:2px solid #ffffff38;margin-top:12px}
    #hud{position:absolute;left:0;right:0;top:0;padding:12px;z-index:5;pointer-events:none}.hudrow{display:flex;align-items:center;gap:8px}.badge{background:#06152ecc;border:1px solid #ffffff24;border-radius:14px;padding:8px 11px;font-size:.82rem;font-weight:800;backdrop-filter:blur(6px)}#levelName{flex:1}.hearts{color:#ff7d7d;letter-spacing:2px}.bar{height:8px;background:#ffffff21;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff29b);transition:width .25s}
    #armor{position:absolute;left:10px;right:10px;bottom:14px;z-index:7;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.armorBtn{border:2px solid #ffffff2b;background:#07162ade;color:#b6c9dc;border-radius:16px;min-height:57px;padding:5px 4px;font-weight:900;font-size:.72rem;box-shadow:0 5px 12px #0005}.armorBtn b{display:block;font-size:1.45rem;line-height:1.1}.armorBtn.unlocked{color:white;border-color:#f6c45399;background:#1b3e61ee}.armorBtn.active{background:var(--gold);color:#10203b;transform:translateY(-4px)}
    #message{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:8;background:#06152ee8;border:1px solid #ffffff2e;border-radius:16px;padding:10px 15px;min-width:230px;max-width:88%;text-align:center;font-weight:800;opacity:0;transition:.25s;pointer-events:none}#message.show{opacity:1}
    .card{width:min(94%,540px);background:linear-gradient(160deg,#12385b,#081b32);border:2px solid #f6c45366;border-radius:26px;padding:24px;box-shadow:0 24px 80px #000a}.cardIcon{font-size:64px}.card h2{font-family:Georgia,serif;color:var(--gold);font-size:2rem;margin:8px}.card p{line-height:1.5;color:#e0efff}.truth{background:#ffffff0d;border-left:4px solid var(--gold);padding:12px;text-align:left;border-radius:8px;margin:16px 0}.small{font-size:.85rem;color:#a9c4dd}.answers{display:grid;gap:9px;margin-top:12px}.answer{border:1px solid #ffffff2a;background:#ffffff10;color:white;border-radius:13px;padding:12px;text-align:left;font-weight:800}.answer.good{background:#17623b}.answer.bad{background:#702b35}
    #pauseBtn{position:absolute;right:12px;top:56px;z-index:9;border:0;background:#07162acc;color:white;width:42px;height:42px;border-radius:50%;font-size:18px}
    .shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.shopItem{padding:12px;background:#ffffff0c;border:1px solid #ffffff25;border-radius:14px}.shopItem b{display:block;color:var(--gold)}
    @media(min-width:680px){#armor{grid-template-columns:repeat(6,1fr)}.armorBtn{min-height:70px}.card{padding:32px}}
  </style>
<meta property="og:type" content="website"><meta property="og:title" content="The Armour of God"><meta property="og:description" content="An adventure about standing firm in truth, faith, and hope."><meta property="og:url" content="https://crownofthornsworship.github.io/armour-of-god/"><meta property="og:image" content="https://crownofthornsworship.github.io/armour-of-god/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="The Armour of God game artwork"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="The Armour of God"><meta name="twitter:description" content="An adventure about standing firm in truth, faith, and hope."><meta name="twitter:image" content="https://crownofthornsworship.github.io/armour-of-god/og.png"></head>
<body><main id="app"><section id="game" aria-label="The Armour of God game">
  <canvas id="canvas"></canvas>
  <div id="hud" class="hidden"><div class="hudrow"><div id="levelName" class="badge">Mission 1</div><div id="sheepCount" class="badge">🐑 0/1</div><div id="hearts" class="badge hearts">♥♥♥</div></div><div class="bar"><i id="progress"></i></div></div>
  <button id="pauseBtn" class="hidden" aria-label="Pause game">Ⅱ</button><div id="message"></div>
  <div id="armor" class="hidden"></div>
  <div id="title" class="screen"><div class="crest">✝</div><h1>The <span>Armour</span><br>of God</h1><p class="lead">Stand firm. Rescue the sheep. Answer lies with God’s truth.</p><p class="verse">“Be strong in the Lord and in his mighty power.” — Ephesians 6:10</p><button class="primary" id="play">BEGIN THE QUEST</button><button class="secondary" id="how">HOW TO PLAY</button><button class="secondary" id="shop">PARENT SHOP</button></div>
  <div id="modal" class="screen hidden"></div>
</section></main>
<script>
const C=document.querySelector('#canvas'),ctx=C.getContext('2d'),game=document.querySelector('#game');let W,H,dpr;
const armorData=[
 {id:'belt',icon:'◆',name:'Truth',ref:'Ephesians 6:14',truth:'God’s truth holds everything together. Jesus said, “I am the way, the truth, and the life.”',color:'#67d4ff'},
 {id:'chest',icon:'▣',name:'Righteousness',ref:'Ephesians 6:14',truth:'Jesus gives his righteousness to everyone who trusts him. We obey because he loves us—not to earn his love.',color:'#72e6a2'},
 {id:'shoes',icon:'➤',name:'Peace',ref:'Ephesians 6:15',truth:'The good news brings peace with God through Jesus. We can carry that peace wherever we go.',color:'#f6c453'},
 {id:'shield',icon:'⬟',name:'Faith',ref:'Ephesians 6:16',truth:'Faith trusts God when fear and doubt fly at us. Even small faith rests in a very strong Savior.',color:'#ff9c5b'},
 {id:'helmet',icon:'◉',name:'Salvation',ref:'Ephesians 6:17',truth:'Salvation is God’s gift. Jesus saves us by grace through faith—not because we win, score points, or behave perfectly.',color:'#ff7eb6'},
 {id:'sword',icon:'†',name:'God’s Word',ref:'Ephesians 6:17',truth:'God’s Word helps us recognize lies and remember what is true. Jesus used Scripture when he was tempted.',color:'#b99cff'}];
const missions=[
 {name:'The Meadow of Lies',piece:0,need:5,sheep:1,enemy:'lie',color:'#174d55'},
 {name:'The Hollow of Shame',piece:1,need:7,sheep:2,enemy:'shame',color:'#233a5f'},
 {name:'The Road of Quarrels',piece:2,need:8,sheep:2,enemy:'anger',color:'#51401f'},
 {name:'The Valley of Doubt',piece:3,need:10,sheep:3,enemy:'doubt',color:'#352957'},
 {name:'The Fog of Fear',piece:4,need:12,sheep:3,enemy:'fear',color:'#402541'},
 {name:'The Stronghold',piece:5,need:16,sheep:4,enemy:'darkness',color:'#171b38'}];
let state='title',level=0,hero,enemies=[],sheep=[],particles=[],score=0,kills=0,rescued=0,unlocked=0,active=0,last=0,spawn=0,keys={},pointer=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;C.width=W*dpr;C.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function armorButtons(){const a=document.querySelector('#armor');a.innerHTML=armorData.map((x,i)=>`<button class="armorBtn ${i<=unlocked?'unlocked':''} ${i===active?'active':''}" data-i="${i}" ${i>unlocked?'disabled':''}><b>${x.icon}</b>${x.name}</button>`).join('');a.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;armorButtons();say(`${armorData[active].name} ready!`)});}
function start(){document.querySelector('#title').classList.add('hidden');document.querySelector('#hud').classList.remove('hidden');document.querySelector('#armor').classList.remove('hidden');document.querySelector('#pauseBtn').classList.remove('hidden');level=0;unlocked=0;active=0;beginLevel()}
function beginLevel(){state='play';hero={x:W/2,y:H*.58,r:18,hp:3,inv:0};enemies=[];particles=[];sheep=[];kills=0;rescued=0;spawn=0;const m=missions[level];for(let i=0;i<m.sheep;i++) sheep.push({x:55+Math.random()*(W-110),y:125+Math.random()*(H-300),saved:false,t:Math.random()*6});updateHud();armorButtons();say(`Find ${m.sheep} sheep • Stand firm!`)}
function updateHud(){const m=missions[level];document.querySelector('#levelName').textContent=`${level+1}/6  ${m.name}`;document.querySelector('#sheepCount').textContent=`🐑 ${rescued}/${m.sheep}`;document.querySelector('#hearts').textContent='♥'.repeat(hero?.hp||0)+'♡'.repeat(3-(hero?.hp||0));document.querySelector('#progress').style.width=Math.min(100,kills/m.need*100)+'%'}
function say(t){let m=document.querySelector('#message');m.textContent=t;m.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>m.classList.remove('show'),1600)}
function spawnEnemy(){const edge=Math.floor(Math.random()*4),pad=25,e={r:14,speed:42+level*7+Math.random()*20,type:level,bob:Math.random()*6};if(edge===0){e.x=-pad;e.y=Math.random()*H}else if(edge===1){e.x=W+pad;e.y=Math.random()*H}else if(edge===2){e.x=Math.random()*W;e.y=90}else{e.x=Math.random()*W;e.y=H-105}enemies.push(e)}
function burst(x,y,col){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,a:1,c:col})}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(state==='play')update(dt);draw(t/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function update(dt){let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;if(pointer){dx=(pointer.x-hero.x)/65;dy=(pointer.y-hero.y)/65}let l=Math.hypot(dx,dy)||1;hero.x+=dx/l*145*dt;hero.y+=dy/l*145*dt;hero.x=Math.max(22,Math.min(W-22,hero.x));hero.y=Math.max(100,Math.min(H-105,hero.y));hero.inv=Math.max(0,hero.inv-dt);
 spawn-=dt;if(spawn<=0&&kills<missions[level].need){spawnEnemy();spawn=Math.max(.42,1.15-level*.09)}
 sheep.forEach(s=>{s.t+=dt;if(!s.saved&&Math.hypot(s.x-hero.x,s.y-hero.y)<36){s.saved=true;rescued++;burst(s.x,s.y,'#fff4d2');say('Sheep rescued! The Shepherd seeks the lost.');updateHud()}});
 enemies.forEach((e,i)=>{let a=Math.atan2(hero.y-e.y,hero.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Math.hypot(e.x-hero.x,e.y-hero.y)<hero.r+e.r){if(active===e.type||active===5){burst(e.x,e.y,armorData[active].color);enemies.splice(i,1);kills++;score+=10;updateHud();if(kills>=missions[level].need&&rescued>=missions[level].sheep)setTimeout(levelComplete,400)}else if(hero.inv<=0){hero.hp--;hero.inv=1.2;enemies.splice(i,1);burst(hero.x,hero.y,'#f66b6b');say(`Use ${armorData[e.type].name} against ${missions[level].enemy}!`);updateHud();if(hero.hp<=0)setTimeout(retry,500)}}});
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.6});particles=particles.filter(p=>p.a>0);if(kills>=missions[level].need&&rescued<missions[level].sheep)say('All clear—find the remaining sheep!')}
function draw(t){let m=missions[level]||missions[0],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,m.color);g.addColorStop(1,'#07162a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.18;for(let i=0;i<35;i++){let x=(i*83%W),y=(i*137%H);ctx.fillStyle=i%3?'#fff':'#67d4ff';ctx.beginPath();ctx.arc(x,y,1.2+Math.sin(t+i)*.5,0,7);ctx.fill()}ctx.globalAlpha=1;
 sheep.forEach(s=>{if(s.saved)return;ctx.save();ctx.translate(s.x,s.y+Math.sin(s.t*2)*3);ctx.fillStyle='#fff4d2';ctx.beginPath();ctx.ellipse(0,0,17,13,0,0,7);ctx.fill();ctx.fillStyle='#253248';ctx.beginPath();ctx.arc(14,-2,8,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(17,-4,2,0,7);ctx.fill();ctx.restore()});
 enemies.forEach(e=>{ctx.save();ctx.translate(e.x,e.y+Math.sin(t*4+e.bob)*3);ctx.fillStyle='#10101d';ctx.shadowColor='#f66b6b';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=armorData[e.type].color;ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(armorData[e.type].icon,0,5);ctx.restore()});
 particles.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;if(hero){ctx.save();ctx.translate(hero.x,hero.y);if(hero.inv&&Math.floor(hero.inv*10)%2)ctx.globalAlpha=.35;ctx.fillStyle='#d7e5f2';ctx.beginPath();ctx.arc(0,0,hero.r,0,7);ctx.fill();ctx.fillStyle='#f6c453';ctx.fillRect(-11,-6,22,22);ctx.fillStyle='#173555';ctx.fillRect(-4,-18,8,33);ctx.fillRect(-12,-9,24,7);ctx.strokeStyle=armorData[active].color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,27+Math.sin(t*5)*2,0,7);ctx.stroke();ctx.restore()}}
function levelComplete(){if(state!=='play')return;state='modal';let a=armorData[missions[level].piece];modal(`<div class="card"><div class="cardIcon">${a.icon}</div><h2>${a.name} Equipped!</h2><div class="truth"><b>${a.ref}</b><br>${a.truth}</div><p class="small">Mission complete because you stood in truth. This does not earn God’s love or salvation.</p><button class="primary" id="continue">TRUTH CHALLENGE</button></div>`);document.querySelector('#continue').onclick=()=>quiz(a)}
function quiz(a){let opts=['Faith',...armorData.filter(x=>x.name!=='Faith').sort(()=>Math.random()-.5).slice(0,2).map(x=>x.name)].sort(()=>Math.random()-.5);modal(`<div class="card"><h2>Which armor helps here?</h2><p>“I feel afraid, but I choose to trust that God is with me.”</p><div class="answers">${opts.map(o=>`<button class="answer" data-o="${o}">${o}</button>`).join('')}</div><p class="small">Tip: trusting God is faith. Every piece works together.</p></div>`);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let good=b.dataset.o==='Faith';b.classList.add(good?'good':'bad');if(good)setTimeout(nextLevel,550);else setTimeout(()=>{b.classList.remove('bad');say('Try again—you can learn without losing anything.')},500)})}
function nextLevel(){if(level===missions.length-1)return ending();level++;unlocked=level;active=level;document.querySelector('#modal').classList.add('hidden');beginLevel()}
function retry(){state='modal';modal(`<div class="card"><div class="cardIcon">🕯️</div><h2>Stand Up Again</h2><p>Mistakes do not make God stop loving you. Learn, try again, and remember the right armor.</p><button class="primary" id="again">TRY AGAIN</button></div>`);document.querySelector('#again').onclick=()=>{document.querySelector('#modal').classList.add('hidden');beginLevel()}}
function ending(){state='modal';modal(`<div class="card"><div class="cardIcon">👑</div><h2>Victory Belongs to Jesus</h2><p>You finished the quest—but finishing a game cannot save anyone.</p><div class="truth"><b>The Gospel</b><br>We all sin and cannot rescue ourselves. Jesus, God’s Son, died for our sins and rose again. Salvation is God’s free gift to everyone who turns to Jesus and trusts him. We are saved by grace through faith, not by our works. See Ephesians 2:8–9.</div><p>Talk with a parent, pastor, or trusted Christian if you want to know more about following Jesus.</p><button class="primary" id="replay">PLAY AGAIN</button></div>`);document.querySelector('#replay').onclick=()=>{score=0;level=0;unlocked=0;active=0;document.querySelector('#modal').classList.add('hidden');beginLevel()}}
function modal(html){let m=document.querySelector('#modal');m.innerHTML=html;m.classList.remove('hidden')}
function info(){modal(`<div class="card"><h2>How to Play</h2><p>Move your knight by dragging anywhere on the field, or use arrow/WASD keys. Tap the glowing armor button that matches each shadow. Rescue every sheep and clear the path.</p><div class="truth"><b>Remember:</b> The armor is a picture of how God helps believers stand firm. Salvation is a gift from Jesus, never a reward for playing.</div><button class="primary close">GOT IT</button></div>`);document.querySelector('.close').onclick=()=>document.querySelector('#modal').classList.add('hidden')}
function shop(){modal(`<div class="card"><h2>Parent Shop</h2><p>Optional appearance-only ideas for the future. The whole story, every level, every rescue, and the Gospel are always free.</p><div class="shopGrid"><div class="shopItem">🌈<b>Color Pack — $0.99</b>No advantage</div><div class="shopItem">🛡️<b>Crest Pack — $0.99</b>No advantage</div></div><p class="small">No loot boxes • No ads • No pay-to-save • No pressure timers • Parent confirmation required before any future purchase.</p><button class="primary close">BACK</button></div>`);document.querySelector('.close').onclick=()=>document.querySelector('#modal').classList.add('hidden')}
document.querySelector('#play').onclick=start;document.querySelector('#how').onclick=info;document.querySelector('#shop').onclick=shop;document.querySelector('#pauseBtn').onclick=()=>{if(state==='play'){state='paused';modal(`<div class="card"><h2>Quest Paused</h2><p>Take your time. There are no streaks, pressure timers, or rewards for rushing.</p><button class="primary" id="resume">KEEP GOING</button><button class="secondary" id="home">MAIN MENU</button></div>`);document.querySelector('#resume').onclick=()=>{document.querySelector('#modal').classList.add('hidden');state='play'};document.querySelector('#home').onclick=()=>location.reload()}};
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);function pos(e){let r=C.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)*W/r.width,y:(q.clientY-r.top)*H/r.height}}C.addEventListener('pointerdown',e=>{if(state==='play')pointer=pos(e)});C.addEventListener('pointermove',e=>{if(pointer&&state==='play')pointer=pos(e)});addEventListener('pointerup',()=>pointer=null);
function registerWebMCP(){const mc=document.modelContext;if(!mc?.registerTool)return;try{mc.registerTool({name:'start_armour_quest',title:'Start Armour Quest',description:'Start a fresh Armour of God game at mission one.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(){if(state==='title')start();else{level=0;unlocked=0;active=0;document.querySelector('#modal').classList.add('hidden');beginLevel()}return{mission:1,status:'playing'}}})}catch{}}registerWebMCP();
</script></section></main><footer style="text-align:center;padding:12px;font:14px system-ui"><a style="color:inherit" href="https://venmo.com/u/MTA-7777" target="_blank" rel="noopener">⚡ Buy Mike a C4 · @MTA-7777</a></footer></body></html>
